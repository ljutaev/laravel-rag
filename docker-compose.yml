services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-rag-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - ./:/var/www
    networks:
      - laravel-rag-network

  web:
    image: nginx:alpine
    container_name: laravel-rag-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-rag-network
    depends_on:
      - app

  db:
    image: ankane/pgvector:latest
    container_name: laravel-rag-db
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_rag}
      POSTGRES_USER: ${DB_USERNAME:-laravel_rag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - laravel-rag-network

  redis:
    image: redis:alpine
    container_name: laravel-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel-rag-network

  adminer:
    image: adminer
    container_name: laravel-rag-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - laravel-rag-network

  ollama:
    image: ollama/ollama:latest
    container_name: laravel-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - laravel-rag-network

networks:
  laravel-rag-network:
    driver: bridge

volumes:
  db-data:
  ollama-data:
